<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE INDUSTRY PASSPORT — ADMIN</title>
<style>
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: #291018;
  color: #F2E9DC;
  font-family: Georgia, serif;
}
.panel {
  width: min(360px, calc(100% - 48px));
  padding: 35px;
  border: 1px solid #D9B779;
  text-align: center;
}
h1 { font-size: 23px; letter-spacing: 3px; }
p { color: #D9B779; font: 11px Arial; letter-spacing: 2px; }
input, button {
  box-sizing: border-box;
  width: 100%;
  padding: 13px;
  margin-top: 14px;
}
button {
  background: #D9B779;
  border: 0;
  cursor: pointer;
}
#message { color: #D9B779; font: 13px Arial; }
</style>
</head>
<body>
<div class="panel">
  <p>THE RACERS PRESENT</p>
  <h1>ADMINISTRATION</h1>
  <p>THE INDUSTRY PASSPORT</p>
  <form id="login-form">
    <input id="email" type="email" placeholder="Email" required>
    <input id="password" type="password" placeholder="Password" required>
    <button type="submit">SIGN IN</button>
  </form>
  <div id="message"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://iqbihzeiqvdpmnxhydkg.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_uj_0pOoegG_p8oBUISibZA_EjwZieRs";

const client = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

document.getElementById("login-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const message = document.getElementById("message");
  message.textContent = "Checking credentials…";

  const { data, error } = await client.auth.signInWithPassword({
    email: document.getElementById("email").value,
    password: document.getElementById("password").value
  });

  if (error) {
    message.textContent = "Login failed. Check your email and password.";
    return;
  }

  const { data: admin, error: adminError } = await client
    .from("admin_users")
    .select("user_id")
    .eq("user_id", data.user.id)
    .maybeSingle();

  if (adminError || !admin) {
    await client.auth.signOut();
    message.textContent = "This account is not an administrator.";
    return;
  }

  window.location.href = "/the-industry-passport/dashboard.html";
});
</script>
</body>
</html>
