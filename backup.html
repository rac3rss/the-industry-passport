  <script>

    const backupButton = document.getElementById("backupButton");

const restoreFile = document.getElementById("restoreFile");
const restoreButton = document.getElementById("restoreButton");
   
restoreFile.addEventListener("change", async () => {
  const file = restoreFile.files[0];

  if (!file) return;

  if (!file.name.toLowerCase().endsWith(".zip")) {
    status.textContent = "PLEASE SELECT A ZIP BACKUP";
    restoreFile.value = "";
    return;
  }

  try {
    status.textContent = "CHECKING BACKUP...";

    const zip = await JSZip.loadAsync(file);
    const jsonFile = zip.file("backup.json");

    if (!jsonFile) {
      throw new Error("backup.json NOT FOUND");
    }

    const backup = JSON.parse(
      await jsonFile.async("string")
    );

    const requiredTables = [
      "participants",
      "passport_pages",
      "passport_stamps",
      "passport_texts"
    ];

    if (!backup.tables) {
      throw new Error("TABLE DATA NOT FOUND");
    }

    for (const table of requiredTables) {
      if (!Array.isArray(backup.tables[table])) {
        throw new Error("INVALID TABLE: " + table);
      }
    }

    const hasPages = Object.keys(zip.files).some(
      path => path.startsWith("passport-pages/")
        && !zip.files[path].dir
    );

    const hasStamps = Object.keys(zip.files).some(
      path => path.startsWith("passport-stamps/")
        && !zip.files[path].dir
    );

    const totalRecords = requiredTables.reduce(
      (sum, table) => sum + backup.tables[table].length,
      0
    );

    status.textContent =
      "BACKUP VERIFIED · " +
      totalRecords +
      " RECORDS · PAGES: " +
      (hasPages ? "YES" : "NO") +
      " · STAMPS: " +
      (hasStamps ? "YES" : "NO");

  } catch (error) {
    console.error(error);
    status.textContent = "INVALID BACKUP: " + error.message;
  }
});

    
restoreButton.addEventListener("click", async () => {
  const file = restoreFile.files[0];

  if (!file) {
    status.textContent = "PLEASE SELECT A BACKUP FIRST";
    return;
  }

  if (!confirm(
    "RESTORE BACKUP? Existing records and files will not be overwritten."
  )) {
    return;

  try {
    restoreButton.disabled = true;

    if (!jsonFile) {

    }

    const backup = JSON.parse(
      await jsonFile.async("string")
    );

    const tableNames = [
      "participants",
      "passport_pages",
      "passport_stamps",
      "passport_texts"
    ];

    // Проверяем структуру архива
    for (const table of tableNames) {
      if (!Array.isArray(backup.tables?.[table])) {
        throw new Error("INVALID TABLE: " + table);
      }
    }

    // Проверяем, что изображения из записей есть в ZIP
    const storageBuckets = [
      "passport-pages",

    ];

    for (const bucket of storageBuckets) {
      const table = bucket === "passport-pages"
        ? "passport_pages"
        : "passport_stamps";

      for (const row of backup.tables[table]) {
        if (!row.image_path) continue;

        const imageEntry = zip.file(
          bucket + "/" + row.image_path
        );

        if (!imageEntry) {
          throw new Error(

          );
        }
      }
    }

    // Восстанавливаем изображения
    for (const bucket of storageBuckets) {
      const prefix = bucket + "/";

      const imagePaths = Object.keys(zip.files).filter(
        path =>
          path.startsWith(prefix) &&
          !zip.files[path].dir
      );

      for (const path of imagePaths) {
        status.textContent =
          "RESTORING IMAGE: " + path;

        
const imageBlob = await zip.files[path].async("blob");
const imagePath = path.slice(prefix.length);

const extension = imagePath
  .split(".")
  .pop()
  .toLowerCase();

const mimeTypes = {
  png: "image/png",
  jpg: "image/jpeg",
  jpeg: "image/jpeg",
  webp: "image/webp",
  gif: "image/gif",
  svg: "image/svg+xml"
};

const contentType =
  mimeTypes[extension] || "application/octet-stream";

if (contentType === "application/octet-stream") {
  throw new Error("UNSUPPORTED IMAGE FORMAT: " + imagePath);
}


const typedBlob = new Blob(
  [imageBlob],
  { type: contentType }
);

const { error } = await db.storage
  .from(bucket)
  .upload(imagePath, typedBlob, {
    upsert: false,
    contentType: contentType
  });



        if (error) {
          const message = error.message || "";

          const alreadyExists =
            error.statusCode === 409 ||
            error.statusCode === "409" ||
            /already exists|duplicate/i.test(message);

          if (!alreadyExists) {
            throw error;
          }
        }
      }
    }

    // Добавляем только отсутствующие записи
    for (const table of tableNames) {
      const rows = backup.tables[table];

      if (rows.length === 0) continue;

      status.textContent = "RESTORING TABLE: " + table;

      const batchSize = 100;

      for (let i = 0; i < rows.length; i += batchSize) {
        const batch = rows.slice(i, i + batchSize);

        const { error } = await db
          .from(table)
          .upsert(batch, {
            onConflict: "id",
            ignoreDuplicates: true
          });

        if (error) throw error;
      }
    }

    status.textContent =
      "RESTORE COMPLETED · EXISTING DATA PRESERVED";

  } catch (error) {
    console.error(error);

    status.textContent =
      "RESTORE ERROR: " + error.message;

  } finally {
    restoreButton.disabled = false;
  }
});

    
async function exportTable(tableName) {
  let allRows = [];
  let offset = 0;
  const limit = 1000;

  while (true) {
    const { data, error } = await db
      .from(tableName)
      .select("*")
      .range(offset, offset + limit - 1);

    if (error) throw error;

    allRows = allRows.concat(data);

    if (data.length < limit) break;

    offset += limit;
  }

  return allRows;
}

backupButton.addEventListener("click", async () => {
  try {
    backupButton.disabled = true;
    status.textContent = "CREATING BACKUP...";

    const backup = {
      version: 1,
      created_at: new Date().toISOString(),
      tables: {}
    };

    const tableNames = [
      "participants",
      "passport_pages",
      "passport_stamps",
      "passport_texts"
    ];

    for (const tableName of tableNames) {
      status.textContent = "EXPORTING: " + tableName;

      backup.tables[tableName] =
        await exportTable(tableName);
    }

    
const zip = new JSZip();

// Сохраняем данные таблиц внутри архива
zip.file(
  "backup.json",
  JSON.stringify(backup, null, 2)
);

// Добавляем изображения страниц и штампов
const storageFiles = [
  {
    bucket: "passport-pages",
    rows: backup.tables.passport_pages
  },
  {
    bucket: "passport-stamps",
    rows: backup.tables.passport_stamps
  }
];

for (const item of storageFiles) {
  for (const row of item.rows) {
    if (!row.image_path) continue;

    status.textContent =
      "DOWNLOADING IMAGE: " + row.image_path;

    const { data: file, error } = await db.storage
      .from(item.bucket)
      .download(row.image_path);

    if (error) throw error;

    zip.file(
      item.bucket + "/" + row.image_path,
      file
    );
  }
}

// Создаём ZIP-архив
status.textContent = "BUILDING ZIP ARCHIVE...";

const blob = await zip.generateAsync({
  type: "blob"
});

const url = URL.createObjectURL(blob);
const link = document.createElement("a");

link.href = url;
link.download =
  "industry-passport-backup-" +
  new Date().toISOString().slice(0, 10) +
  ".zip";

link.click();

URL.revokeObjectURL(url);

    URL.revokeObjectURL(url);

    status.textContent = "BACKUP CREATED SUCCESSFULLY";
  } catch (error) {
    console.error(error);
    status.textContent = "BACKUP ERROR: " + error.message;
  } finally {
    backupButton.disabled = false;
  }
});


    async function initializeBackup() {
      const { data: { session }, error } =
        await db.auth.getSession();

      if (error || !session) {
        status.textContent = "ADMIN LOGIN REQUIRED";
        return;
      }

      const { data: admin, error: adminError } = await db
        .from("admin_users")
        .select("user_id")
        .eq("user_id", session.user.id)
        .maybeSingle();

      if (adminError || !admin) {
        status.textContent = "ACCESS DENIED";
        return;
      }

      status.textContent = "ADMIN ACCESS VERIFIED";
      backupButton.style.display = "block";
      restoreSection.style.display = "block";
    }

    initializeBackup();
  </script>
