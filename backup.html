
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE INDUSTRY PASSPORT — Backup</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px;
      background: #171717;
      color: #eee;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 700px;
      margin: 40px auto;
      padding: 30px;
      background: #242424;
      border: 1px solid #51483d;
      border-radius: 12px;
    }

    h1 {
      font-size: 24px;
      letter-spacing: 2px;
    }

    p {
      color: #aaa;
      line-height: 1.6;
    }

    button {
      padding: 13px 20px;
      margin-top: 15px;
      background: #9b825e;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 5px;
    }

    #status {
      margin-top: 20px;
      color: #c5ad87;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>THE INDUSTRY PASSPORT</h1>
    <p>BACKUP & RESTORE SYSTEM</p>

    <p id="status">CHECKING ADMIN ACCESS...</p>

    <button id="backupButton" style="display:none;">
      CREATE BACKUP
    </button>
  </main>

  <script>
    const SUPABASE_URL =
      "https://iqbihzeiqvdpmnxhydkg.supabase.co";

    const SUPABASE_KEY = "sb_publishable_uj_0pOoegG_p8oBUISibZA_EjwZieRs";

    const db = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const status = document.getElementById("status");
    const backupButton = document.getElementById("backupButton");

    async function initializeBackup() {
      const { data: { session }, error } =
        await db.auth.getSession();

      if (error || !session) {
        status.textContent = "ADMIN LOGIN REQUIRED";
        return;
      }

      const { data: admin, error: adminError } = await db
        .from("admin_users")
        .select("user_id")
        .eq("user_id", session.user.id)
        .maybeSingle();

      if (adminError || !admin) {
        status.textContent = "ACCESS DENIED";
        return;
      }

      status.textContent = "ADMIN ACCESS VERIFIED";
      backupButton.style.display = "block";
    }

    initializeBackup();
  </script>
</body>
</html>
