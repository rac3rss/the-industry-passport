.page-canvas {
  position: relative;
  display: inline-block;
  max-width: 100%;
  max-height: 650px;
}

.page-image {
  display: block;
  max-width: 100%;
  max-height: 650px;
  object-fit: contain;
}


 .stamp-layer {
  position: absolute;
  inset: 0;
  pointer-events: auto;
}

.stamp-wrapper {
  position: absolute;
  transform: translate(-50%, -50%);
  border: 1px dashed #d6bd96;
  pointer-events: auto;
  touch-action: none;
  cursor: grab;
}

.stamp-image {
  display: block;
  width: 100%;
  height: auto;
  pointer-events: none;
  user-select: none;
}
.text-wrapper {
  position: absolute;
  min-height: 24px;
  padding: 5px;
  border: 1px dashed #d6bd96;
  transform-origin: center;
  text-align: center;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  pointer-events: auto;
  cursor: grab;
  user-select: none;
  touch-action: none;
}

.resize-handle {
  position: absolute;
  width: 12px;
  height: 12px;
  right: -6px;
  bottom: -6px;
  background: #d6bd96;
  border: 2px solid #101014;
  cursor: nwse-resize;
}
.text-resize-handle {
  position: absolute;
  width: 12px;
  height: 12px;
  right: -6px;
  bottom: -6px;
  background: #8b789f;
  border: 2px solid #101014;
  cursor: nwse-resize;
}
.rotate-handle {
  position: absolute;
  width: 14px;
  height: 14px;
  top: -25px;
  left: 50%;
  transform: translateX(-50%);
  border-radius: 50%;
  background: #d6bd96;
  border: 2px solid #101014;
  cursor: grab;
}
    #status {

      }

        .maybeSingle(),
      db
        .from("participants")
        .select("id, name, project_name")
        .order("created_at", { ascending: false })

    if (adminError) throw adminError;

        if (error) throw error;

  let newFilePath = null;
let databaseUpdated = false;

  try {
    const { data: oldStamp, error: fetchError } = await db
      .from("passport_stamps")
      .select("image_path")
      .eq("id", selectedStampId)
      .single();

    if (fetchError) throw fetchError;

    newFilePath =
      crypto.randomUUID() + "-" +
      file.name.replace(/[^a-zA-Z0-9._-]/g, "_");

    const { error: uploadError } = await db.storage
      .from("passport-stamps")
      .upload(newFilePath, file, {
        contentType: "image/png",
        upsert: false
      });

    if (uploadError) throw uploadError;

    const { error: updateError } = await db
      .from("passport_stamps")

    if (updateError) throw updateError;
databaseUpdated = true;

    const { error: removeError } = await db.storage
      .from("passport-stamps")

    if (removeError) {

      status.textContent = "STAMP REPLACED · OLD FILE NOT REMOVED";

    stampFile.value = "";

    if (newFilePath && !databaseUpdated) {
  await db.storage
    .from("passport-stamps")
    .remove([newFilePath]);
}

    status.textContent = "REPLACE ERROR: " + error.message;

  } finally {
    replaceButton.disabled = false;
  }
